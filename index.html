<!DOCTYPE html>
<html lang="th"><head>
<meta data-k="" charset="utf-8">
<meta data-k="" name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title data-k="">Pibo Collections</title>
<link data-k="" rel="preconnect" href="https://fonts.googleapis.com">
<link data-k="" rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link data-k="" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,400;0,600;1,400&amp;family=Pinyon+Script&amp;family=Prompt:wght@300;400;500;600&amp;family=Noto+Serif+Thai:wght@500&amp;display=swap" rel="stylesheet">
<style data-k="">
:root{
  --pink:#F0C9D1; --pink2:#EBBCC7; --cream:#FBF3EA; --brown:#3A2227; --dusty:#B98A94; --price:#A05A6A;
  --bg:#FBF3EA; --surface:#FFFFFF; --sheet:#FFF9F6; --sub:#FFF1EF; --ink:#3A2227; --muted:#8C6E74;
  --line:#ECD3D8; --chip:#D9BFC4; --btn2:#E9D3D8; --green:#3F7A4E; --on-brown:#FBF3EA;
  --shadow:0 2px 10px rgba(60,25,35,.08);
  --paper:repeating-linear-gradient(0deg,var(--pink) 0 2px,var(--pink2) 2px 3px);
  --serif:"Bodoni Moda","Noto Serif Thai",Georgia,serif;
  --script:"Pinyon Script","Noto Serif Thai",Georgia,serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --pink:#4A2E35; --pink2:#43282F; --cream:#2A1C20; --brown:#F0C9D1; --dusty:#C99AA5; --price:#E7A3B3;
  --bg:#1F1517; --surface:#2A1C20; --sheet:#251A1D; --sub:#33232A; --ink:#F6E6E9; --muted:#BFA2A9;
  --line:#3E2B31; --chip:#5A3F46; --btn2:#3A2A2F; --green:#7CC48E; --on-brown:#2A1C20; --shadow:0 2px 10px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --pink:#4A2E35; --pink2:#43282F; --cream:#2A1C20; --brown:#F0C9D1; --dusty:#C99AA5; --price:#E7A3B3;
  --bg:#1F1517; --surface:#2A1C20; --sheet:#251A1D; --sub:#33232A; --ink:#F6E6E9; --muted:#BFA2A9;
  --line:#3E2B31; --chip:#5A3F46; --btn2:#3A2A2F; --green:#7CC48E; --on-brown:#2A1C20; --shadow:0 2px 10px rgba(0,0,0,.4); color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Prompt","Noto Sans SC",system-ui,sans-serif;font-weight:300;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
a{color:inherit}
:focus-visible{outline:2px solid var(--price);outline-offset:2px}
svg{display:block}
b,strong,h1,h2,h3,h4{font-weight:500}
.app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:86px;background:var(--bg)}
.view{display:none}.view.on{display:block}

/* hero */
.hero{--pink:#F0C9D1;--pink2:#EBBCC7;--cream:#FBF3EA;--brown:#3A2227;--chip:#D9BFC4;--on-brown:#FBF3EA;--paper:repeating-linear-gradient(0deg,#F0C9D1 0 2px,#EBBCC7 2px 3px);color-scheme:light;color:#3A2227;background:var(--paper);padding:8px 12px;position:relative;overflow:hidden}
.topbar{display:flex;align-items:center;gap:4px}
.iconbtn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--brown)}
.iconbtn.solid{background:var(--cream)}
.langs{margin-left:auto;display:flex;gap:4px}
.langs button{border:1px solid var(--chip);background:var(--cream);border-radius:999px;padding:4px 8px;font-size:12px;font-weight:400}
.langs button.on{background:var(--brown);color:var(--on-brown);border-color:var(--brown)}
.hero-main{display:flex;align-items:flex-end;gap:14px;margin-top:14px;padding-bottom:18px}
.hero-txt{flex:1;min-width:0}
.brandline{display:flex;align-items:flex-end;gap:8px}
.brandline{margin-left:4px;gap:4px;align-items:center}
.brandline img{width:30px;height:auto}
.title{font-family:var(--serif);font-size:17px;line-height:.9;letter-spacing:-.03em;color:var(--brown)}
.hero-frame{flex:0 0 132px;height:168px;border-radius:10px;overflow:hidden;position:relative;border:3px solid var(--cream);box-shadow:0 6px 16px rgba(60,25,35,.2);background:var(--pink)}
.hf-track{display:flex;height:100%;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.hf-track>div{flex:0 0 100%;height:100%}
.hf-track img,.hf-track svg{width:100%;height:100%;object-fit:cover}
.hf-cap{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 6px;background:linear-gradient(transparent,rgba(58,34,39,.6));color:#FBF3EA;font-size:11px;line-height:1.25}
.hf-cap b{display:block;font-size:12px}
.title span{display:block;font-family:var(--script);font-size:1.15em;letter-spacing:0;margin-top:2px}
.hero p{margin:12px 0 0;font-size:13px;color:var(--brown);line-height:1.5}

.carousel{margin-top:18px}
.track{display:flex;gap:10px;padding:0 16px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 16px;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.track::-webkit-scrollbar{display:none}
.slide{scroll-snap-align:start}
.dots i{cursor:pointer}
.slide{flex:0 0 86%;height:170px;border-radius:14px;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:16px;text-align:left}
.slide .art{position:absolute;inset:0}
.slide .art img,.slide .art svg{width:100%;height:100%;object-fit:cover;object-position:center;display:block}
.slide .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(58,34,39,.55),rgba(58,34,39,0) 70%)}
.slide h3{position:relative;margin:0;font-family:var(--serif);font-size:26px;color:#FBF3EA;font-weight:400}
.slide small{position:relative;display:block;color:#FBF3EA;font-size:12px}
.slide .tag{position:absolute;top:12px;left:14px;background:#FBF3EA;color:#3A2227;font-size:11px;border-radius:999px;padding:3px 10px;font-weight:400;z-index:1}
.dots{display:flex;justify-content:center;align-items:center;gap:8px;margin:12px 0;height:18px}
.dots i{display:block;width:10px;height:10px;color:var(--chip);transition:transform .4s cubic-bezier(.2,.8,.2,1),color .3s}
.dots i svg{width:100%;height:100%}
.dots i.on{color:var(--price);transform:scale(1.6) rotate(36deg)}

.switch{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));width:calc(100% - 32px);max-width:448px;z-index:41;background:var(--surface);display:flex;gap:4px;padding:5px;border:1px solid var(--line);border-radius:999px;box-shadow:0 6px 20px rgba(40,18,24,.18)}
.switch button{flex:1;height:40px;border-radius:999px;font-weight:400;font-size:15px;color:var(--brown);display:flex;align-items:center;justify-content:center;gap:8px}
.switch button.on{background:var(--brown);color:var(--on-brown)}
.count{min-width:24px;height:24px;border-radius:12px;display:inline-grid;place-items:center;font-size:13px;background:var(--pink);color:var(--brown)}

section{padding:20px 16px 4px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px;gap:10px}
.sec-h h2{margin:0;font-size:20px;font-weight:500}
.sec-h span{font-size:13px;color:var(--muted)}
.sec-h a{font-size:13px;text-decoration:underline;cursor:pointer}
.promo{background:var(--sub);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.promo h3{margin:0 0 4px;font-family:var(--serif);font-size:22px;color:var(--price);font-weight:400}
.promo p{margin:0;font-size:13px;color:var(--muted)}

.hrow{display:flex;gap:12px;overflow-x:auto;margin:14px -16px 0;padding:0 16px 6px;scrollbar-width:none}
.hrow .card{flex:0 0 44%}

.why{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.why div{background:var(--surface);border-radius:12px;padding:14px 12px;display:flex;align-items:center;gap:10px;font-size:14px;font-weight:400;box-shadow:var(--shadow);line-height:1.3}
.why b{flex:0 0 32px;height:32px;border-radius:50%;background:var(--pink);display:grid;place-items:center;font-size:15px}

.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 8px}
.fold{position:relative;padding-top:16px;text-align:left;display:block;width:100%}
.fold .tab{position:absolute;top:0;height:18px;width:70%;background:var(--paper);border-radius:8px 10px 0 0;font-size:10px;padding:2px 7px;color:var(--brown);font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fold:nth-child(odd) .tab{left:0}.fold:nth-child(even) .tab{right:0}
.fold .fbody{background:var(--paper);border-radius:12px;display:flex;height:118px;overflow:hidden;box-shadow:0 4px 10px rgba(60,25,35,.12);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.fold:nth-child(odd) .fbody{border-top-left-radius:0}.fold:nth-child(even) .fbody{border-top-right-radius:0}
.fold:active .fbody{transform:translateY(-4px)}
.fold .lab{flex:0 0 24px;display:flex;justify-content:center;padding:6px 0 6px 4px}
.fold .lab span{writing-mode:vertical-rl;transform:rotate(180deg);background:#FBF3EA;border:1px solid var(--chip);border-radius:2px;padding:6px 2px;font-size:11px;color:#3A2227;font-weight:400;max-height:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold .strip{flex:1;margin:6px 6px 6px 4px;border-radius:6px;overflow:hidden}
.fold .strip img,.fold .strip svg{width:100%;height:100%;object-fit:cover}
.fold.wide{grid-column:1/-1}
.fold.wide .fbody{height:52px;align-items:center;padding:0 14px;justify-content:space-between;font-family:var(--serif);font-size:18px;color:var(--brown)}
.fold.wide .fbody small{font-family:Prompt,sans-serif;font-size:13px}
.circ{width:58px;height:58px;border-radius:50%;overflow:hidden;border:2px solid var(--cream);background:var(--cream)}

.cats{display:flex;gap:20px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.cats button{padding:8px 0 10px;font-size:15px;color:var(--muted);white-space:nowrap;border-bottom:2px solid transparent}
.cats button.on{color:var(--brown);border-color:var(--brown);font-weight:500}
.chips{display:flex;gap:8px;margin-top:12px;overflow-x:auto;scrollbar-width:none}
.chips button{border:1px solid var(--chip);border-radius:999px;padding:6px 14px;font-size:13px;background:var(--surface);white-space:nowrap}
.chips button.on{background:var(--pink);border-color:var(--brown)}
.budget{display:flex;align-items:center;gap:12px;margin-top:14px;font-size:14px}
.budget input{flex:1;accent-color:var(--brown)}
.budget b{min-width:62px;text-align:right;color:var(--price)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.card{background:var(--surface);border-radius:10px;overflow:hidden;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;width:100%}
.card .ph{aspect-ratio:3/4;position:relative;background:var(--pink);flex:0 0 auto;width:100%;overflow:hidden}
.card .ph img,.card .ph svg{width:100%;height:100%;object-fit:cover;display:block}
.badge{position:absolute;left:8px;top:8px;font-size:11px;border-radius:999px;padding:2px 9px;background:#FBF3EA;color:#3A2227;font-weight:400}
.badge.pre{background:#3A2227;color:#FBF3EA}
.card .body{padding:9px 10px 11px;flex:1 1 auto;width:100%}
.card h4{margin:0 0 2px;font-size:14px;font-weight:400;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.card .fold{font-size:11px;color:var(--muted)}
.price{color:var(--price);font-weight:500;font-size:16px}
.card .ship{font-size:12px;color:var(--muted);margin-top:2px}
.empty{text-align:center;padding:40px 10px;color:var(--muted);grid-column:1/-1;font-size:14px}

.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom,0px));z-index:40}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--muted)}
.nav button.on{color:var(--brown);font-weight:500}

/* folder page */
.cover{height:140px;position:relative;background:var(--paper)}
.back{position:absolute;left:14px;top:14px;width:38px;height:38px;border-radius:50%;background:var(--brown);color:var(--on-brown);display:grid;place-items:center;z-index:5}
.fp-head{text-align:center;margin-top:-54px;position:relative}
.fp-head .circ{width:104px;height:104px;margin:0 auto;border:4px solid var(--bg)}
.fp-head h2{margin:10px 0 4px;font-size:24px;font-family:var(--serif);font-weight:400}
.fp-head span{font-size:13px;color:var(--muted)}

/* product */
.gal{position:relative;aspect-ratio:1/1;overflow:hidden;background:var(--pink)}
.gal-track{display:flex;height:100%;transition:transform .35s ease;touch-action:pan-y}
.gal-track>div{flex:0 0 100%;height:100%}
.gal-track img,.gal-track svg{width:100%;height:100%;object-fit:cover}
.gal-count{position:absolute;right:12px;bottom:12px;background:rgba(251,243,234,.92);color:#3A2227;border-radius:6px;font-size:12px;padding:2px 8px}
.thumbs{display:flex;gap:8px;padding:10px 16px 0;overflow-x:auto}
.thumbs button{flex:0 0 54px;height:54px;border-radius:8px;overflow:hidden;border:2px solid transparent}
.thumbs button.on{border-color:var(--brown)}
.thumbs img,.thumbs svg{width:100%;height:100%;object-fit:cover}
.pd{padding:12px 16px 24px}
.pd .by{font-size:13px;color:var(--muted);margin-bottom:4px}
.pd h1{font-size:24px;margin:2px 0 6px;font-family:var(--serif);font-weight:400}
.pd .desc{font-size:14px;color:var(--muted);margin:0 0 12px;white-space:pre-line}
.pd .big{font-size:26px}
.facts{background:var(--surface);border-radius:12px;padding:4px 14px;margin:14px 0;box-shadow:var(--shadow)}
.facts div{display:flex;gap:10px;align-items:center;padding:11px 0;font-size:14px;border-bottom:1px solid var(--line)}
.facts div:last-child{border:0}
.facts .ok{color:var(--green)}
.contact{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
.cicons{display:flex;gap:8px}
.cicons a{width:34px;height:34px;border-radius:50%;background:var(--cream);border:1px solid var(--line);color:var(--brown);display:grid;place-items:center;box-shadow:var(--shadow)}
.buybar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--surface);border-top:1px solid var(--line);display:flex;gap:10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));z-index:45}
.buybar .chat{width:48px;height:48px;border-radius:50%;background:var(--btn2);color:var(--brown);display:grid;place-items:center;flex:0 0 auto}
.btn-p{flex:1;height:48px;border-radius:999px;font-size:16px;font-weight:500;background:var(--brown);color:var(--on-brown);display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn-s{flex:1;height:48px;border-radius:999px;font-size:15px;font-weight:400;background:var(--btn2);color:var(--brown)}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(40,18,24,.45);z-index:70;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,100%);width:100%;max-width:480px;max-height:92%;background:var(--sheet);border-radius:18px 18px 0 0;z-index:80;transition:transform .3s ease;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet.on{transform:translate(-50%,0)}
.sheet-h{padding:14px 56px 12px 18px;position:relative;border-bottom:1px solid var(--line)}
.sheet-h::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--chip);margin:0 auto 10px}
.sheet-h h3{margin:0;font-size:22px;font-family:var(--serif);font-weight:400}
.sheet-h .x{position:absolute;right:14px;top:24px;width:34px;height:34px;border-radius:8px;background:var(--btn2);display:grid;place-items:center}
.sheet-b{overflow-y:auto;padding:14px 18px 16px;font-size:14px}
.sheet-b p{margin:0 0 12px;color:var(--muted);line-height:1.5}
.sheet-b label{display:block;font-size:13px;margin-bottom:6px;font-weight:400}
textarea{width:100%;font:inherit;font-size:14px;padding:10px 12px;border-radius:10px;border:1px solid var(--chip);background:var(--surface);color:var(--ink);resize:vertical}
textarea[readonly]{background:var(--sub);min-height:180px;font-size:13px}
.charc{text-align:right;font-size:11px;color:var(--muted);margin:2px 0 10px}
.sheet-f{padding:10px 18px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.sheet-f>*{flex:0 0 auto;width:100%}
.step{display:flex;gap:12px;padding:10px 0}
.sendok{background:#E8F4EA;color:#2F6B3C;border-radius:10px;padding:12px 14px;font-size:15px;font-weight:500;margin-bottom:6px}
.sendwarn{background:var(--sub);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--price)!important;font-weight:500;margin-top:8px!important}
.step i{flex:0 0 28px;height:28px;border-radius:50%;background:var(--pink);display:grid;place-items:center;font-style:normal;font-weight:500}
.datein{display:block;width:100%;font:inherit;font-size:15px;padding:10px 12px;border-radius:10px;border:1px solid var(--chip);background:var(--surface);color:var(--ink);min-height:44px}
.sheet-b p.hint{font-size:12px;margin:6px 0 14px}
.pkf{margin:-4px 0 14px;padding:12px;border-radius:10px;background:var(--sub)}
.pkf input{width:100%;font:inherit;font-size:15px;padding:10px 12px;border-radius:10px;border:1px solid var(--chip);background:var(--surface);color:var(--ink);margin-bottom:10px}
.pkf input:last-child{margin-bottom:0}
.recv{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.recv button{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--chip);border-radius:10px;padding:10px 12px;background:var(--surface);text-align:left;font-size:14px}
.recv button.on{border-color:var(--brown);background:var(--sub)}
.recv b{color:var(--price);white-space:nowrap}
.pickbox{background:var(--surface);border-radius:12px;padding:14px;margin:18px 16px;box-shadow:var(--shadow);font-size:14px}
.pickbox b{display:block;margin-bottom:6px}
.pickbox div{padding:4px 0}
.pickbox p{margin:8px 0 0;font-size:13px;color:var(--muted)}
.booth-empty{text-align:center;padding:40px 28px;display:flex;flex-direction:column;align-items:center;gap:6px}
.booth-empty h3{margin:10px 0 0;font-family:var(--serif);font-weight:400;font-size:24px}
.booth-empty p{margin:0 0 10px;color:var(--muted);font-size:14px;line-height:1.6;max-width:300px}
.drawer{position:fixed;top:0;bottom:0;left:0;width:78%;max-width:320px;background:var(--sheet);z-index:80;transform:translateX(-100%);transition:transform .3s;padding:calc(24px + env(safe-area-inset-top,0px)) 20px 20px}
.drawer.on{transform:none}
.drawer img{width:70px}
.drawer button{display:block;width:100%;text-align:left;padding:14px 4px;border-bottom:1px solid var(--line);font-size:16px}
.search{padding:12px 16px;position:sticky;top:0;background:var(--bg);z-index:5;display:flex;gap:8px;align-items:center}
.search input{flex:1;font:inherit;padding:12px 16px;border-radius:999px;border:1px solid var(--chip);background:var(--surface);color:var(--ink);font-size:15px}
.toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,20px);background:#3A2227;color:#FBF3EA;padding:10px 18px;border-radius:999px;font-size:14px;z-index:99;opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.page-h{padding:20px 16px 4px;font-size:26px;font-family:var(--serif);font-weight:400;margin:0}
.clist a{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:12px;padding:14px;margin:10px 16px;text-decoration:none;box-shadow:var(--shadow);font-size:15px}
.clist a span{width:40px;height:40px;border-radius:50%;background:var(--pink);display:grid;place-items:center;color:var(--brown)}
/* ---------- iPad / คอม ---------- */
.card{transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
@media (hover:hover){.card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(60,25,35,.14)}.fold:hover .fbody{transform:translateY(-4px)}}
@media (min-width:768px){
  .app{max-width:1080px}
  .nav,.buybar{max-width:1080px}
  .switch{max-width:460px}
  section{padding-left:24px;padding-right:24px}
  .hero{padding:10px 24px}
  .track{padding:0 24px;scroll-padding:0 24px}
  .slide{flex:0 0 calc(50% - 5px);height:230px}
  .grid{grid-template-columns:repeat(3,1fr);gap:16px}
  .hrow{margin:14px -24px 0;padding:0 24px 8px}
  .hrow .card{flex:0 0 220px}
  .fold .fbody{height:150px}
  .cover{height:180px}
  #v-product.on{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:32px;align-items:start;padding:24px 24px 0}
  #v-product .gal{grid-column:1;border-radius:16px}
  #v-product .thumbs{grid-column:1;padding:12px 0 0}
  #v-product .pd{grid-column:2;grid-row:1 / span 2;padding:0 0 24px}
  .pd h1{font-size:32px}
  .sheet{max-width:520px;top:50%;bottom:auto;max-height:86vh;border-radius:18px;transform:translate(-50%,-44%);opacity:0;pointer-events:none;transition:transform .3s ease,opacity .25s}
  .sheet.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
  .sheet-h::before{display:none}
}
@media (min-width:1024px){
  .grid{grid-template-columns:repeat(4,1fr)}
  .slide{flex:0 0 calc(33.333% - 7px)}
  #v-folder .grid{grid-template-columns:repeat(4,1fr)}
}

.ed .row2 label{margin-top:12px}

.ed-imgs{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.ed-imgs .im{position:relative;width:78px;height:96px;border-radius:8px;overflow:hidden;background:var(--pink)}
.ed-imgs .im img{width:100%;height:100%;object-fit:cover}
.ed-imgs .im .cv{position:absolute;left:4px;bottom:4px;background:#3A2227;color:#FBF3EA;font-size:10px;border-radius:999px;padding:1px 6px}
.ed-imgs .im button{position:absolute;top:3px;width:24px;height:24px;border-radius:50%;background:rgba(251,243,234,.95);color:#3A2227;font-size:12px;display:grid;place-items:center}

.ed-add{width:78px;height:96px;border-radius:8px;border:1.5px dashed var(--chip);display:grid;place-items:center;text-align:center;font-size:12px;color:var(--muted);cursor:pointer;padding:4px}
.ed-add input{display:none}

.btn-del.arm{background:#B4536A;color:#fff}
.saving{position:fixed;inset:0;z-index:120;background:rgba(40,18,24,.5);display:none;place-items:center}
.saving.on{display:grid}
.saving div{background:var(--sheet);color:var(--ink);border-radius:14px;padding:18px 22px;display:flex;gap:12px;align-items:center;font-size:15px}
.spin{width:20px;height:20px;border-radius:50%;border:2.5px solid var(--chip);border-top-color:var(--price);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

function art(kind,v=0,bgOnly){
 const [bg,a,c]=PAL[v%3];
 const back=`<rect width="300" height="400" fill="${bg}"/>${[...Array(40)].map((_,i)=>`<rect y="${i*10}" width="300" height="2" fill="#000" opacity=".025"/>`).join('')}`;
 const fl=(x,y,r,col)=>[0,1,2,3,4,5].map(i=>{const g=i*60*Math.PI/180;return `<ellipse cx="${x+Math.cos(g)*r*.55}" cy="${y+Math.sin(g)*r*.55}" rx="${r*.5}" ry="${r*.3}" transform="rotate(${i*60} ${x+Math.cos(g)*r*.55} ${y+Math.sin(g)*r*.55})" fill="${col}"/>`}).join('')+`<circle cx="${x}" cy="${y}" r="${r*.25}" fill="${a}"/>`;
 let g='';
 if(kind==='bouquet'){g=`<path d="M70 170 L150 360 L230 170 Z" fill="#FBF3EA"/><path d="M70 170 L150 360 L110 170Z" fill="#000" opacity=".05"/>${fl(115,150,48,c)}${fl(185,150,48,'#fff')}${fl(150,115,52,c)}${fl(150,175,44,'#FFF7F2')}<path d="M125 300 q25 18 50 0 q-10 30 -25 30 q-15 0 -25 -30" fill="${a}"/>`}
 else if(kind==='cake'){g=`<rect x="70" y="220" width="160" height="110" rx="8" fill="#FBF3EA"/><rect x="70" y="220" width="160" height="22" fill="${c}"/><ellipse cx="150" cy="222" rx="80" ry="16" fill="#FFF7F2"/>${fl(115,200,40,c)}${fl(185,200,40,'#fff')}${fl(150,180,46,c)}<rect x="60" y="328" width="180" height="8" rx="4" fill="${a}"/>`}
 else if(kind==='marimo'){g=`<path d="M95 150 h110 v170 q0 25 -25 25 h-60 q-25 0 -25 -25z" fill="#fff" opacity=".55"/><rect x="92" y="140" width="116" height="16" rx="6" fill="${a}"/><circle cx="150" cy="292" r="40" fill="#5E8A4E"/><circle cx="138" cy="280" r="12" fill="#7FA866" opacity=".7"/><path d="M100 330 h100" stroke="#E6D3B3" stroke-width="10"/>`}
 else if(kind==='keychain'){g=`<circle cx="150" cy="105" r="34" fill="none" stroke="${a}" stroke-width="9"/><path d="M150 139 v30" stroke="${a}" stroke-width="7"/><rect x="95" y="165" width="110" height="150" rx="40" fill="#FBF3EA"/>${fl(150,240,58,c)}<circle cx="150" cy="182" r="7" fill="${a}"/>`}
 else {g=`<rect x="70" y="80" width="160" height="210" fill="#FBF3EA" transform="rotate(-4 150 185)"/><rect x="86" y="96" width="128" height="150" fill="${c}" transform="rotate(-4 150 185)"/>${fl(150,170,50,'#fff')}<path d="M150 300 q-30 -26 -30 -42 a15 15 0 0 1 30 -4 a15 15 0 0 1 30 4 q0 16 -30 42z" fill="${a}"/>`}
 return `<svg viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice" width="100%" height="100%">${back}${bgOnly?'':g}</svg>`;
}

let CROP=null;
function loadImg(src){return new Promise((res,rej)=>{const im=new Image();if(!src.startsWith('data:'))im.crossOrigin='anonymous';im.onload=()=>res(im);im.onerror=rej;im.src=src})}
async function openCrop(kind,idx,src){
 if(kind==='ed')edSync();
 const url=src||(kind==='ed'?ED.imgs[idx]:'');
 let im;try{im=await loadImg(url)}catch(e){toast('เปิดรูปไม่ได้');return}
 const ar=kind==='cover'?16/9:1;
 CROP={kind,idx,im,ar,z:1,x:0,y:0,back:kind==='ed'};
 let ov=document.getElementById('cropOv');if(!ov){ov=document.createElement('div');ov.id='cropOv';ov.className='zoom on';document.body.appendChild(ov)}else ov.classList.add('on');
 ov.innerHTML=`<div class="crop"><div class="crop-h">${kind==='cover'?'ปรับรูปปกหมวด':'ปรับรูปสินค้า'} <small>ลากเพื่อเลื่อน · ปรับแถบเพื่อซูม</small></div>
  <div class="crop-v" id="cropV" style="aspect-ratio:${ar}"><canvas id="cropC"></canvas></div>
  <input type="range" id="cropZ" min="1" max="4" step="0.01" value="1" oninput="CROP.z=+this.value;drawCrop()">
  <div class="crop-f"><button class="btn-s" onclick="closeCrop()">ยกเลิก</button><button class="btn-p" onclick="saveCrop()">ใช้รูปนี้</button></div></div>`;
 const v=document.getElementById('cropV'),c=document.getElementById('cropC');
 const r=v.getBoundingClientRect();c.width=Math.round(r.width*2);c.height=Math.round(r.height*2);
 let drag=null;
 v.onpointerdown=e=>{drag={x:e.clientX,y:e.clientY,ox:CROP.x,oy:CROP.y};v.setPointerCapture(e.pointerId)};
 v.onpointermove=e=>{if(!drag)return;const k=c.width/v.clientWidth;CROP.x=drag.ox+(e.clientX-drag.x)*k;CROP.y=drag.oy+(e.clientY-drag.y)*k;drawCrop()};
 v.onpointerup=v.onpointercancel=()=>drag=null;
 drawCrop();
}
function cropGeom(W,H){const im=CROP.im;const base=Math.max(W/im.width,H/im.height);const s=base*CROP.z;const w=im.width*s,h=im.height*s;
 const mx=(w-W)/2,my=(h-H)/2;CROP.x=Math.max(-mx,Math.min(mx,CROP.x*(W/(CROP._W||W))));CROP.y=Math.max(-my,Math.min(my,CROP.y*(H/(CROP._H||H))));CROP._W=W;CROP._H=H;
 return {s,dx:(W-w)/2+CROP.x,dy:(H-h)/2+CROP.y,w,h}}
function drawCrop(){const c=document.getElementById('cropC');if(!c)return;const x=c.getContext('2d');const g=cropGeom(c.width,c.height);x.fillStyle='#FBF3EA';x.fillRect(0,0,c.width,c.height);x.drawImage(CROP.im,g.dx,g.dy,g.w,g.h)}
function closeCrop(){const ov=document.getElementById('cropOv');if(ov)ov.classList.remove('on');CROP=null}
async function saveCrop(){
 const pc=document.getElementById('cropC');const W=CROP.ar>1?1600:1000,H=Math.round(W/CROP.ar);
 const k=W/pc.width;const g0=cropGeom(pc.width,pc.height);
 const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.fillStyle='#FBF3EA';x.fillRect(0,0,W,H);
 x.drawImage(CROP.im,g0.dx*k,g0.dy*k,g0.w*k,g0.h*k);
 let data;try{data=c.toDataURL('image/jpeg',.82)}catch(e){toast('รูปนี้ปรับไม่ได้ (ติดสิทธิ์รูปจากเว็บอื่น)');return}
 const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',.84));
 showSaving('กำลังบันทึกรูป…');let src=data;
 if(ADM.assets){try{const up=await ADM.assets.upload(blob);if(up&&up.url)src=up.url}catch(e){}}
 hideSaving();const C=CROP;closeCrop();
 if(C.kind==='ed'){ED.imgs[C.idx]=src;renderEditor()}
 else if(C.kind==='cover'){CONFIG.items[C.idx].cover=src;await publishShop('เปลี่ยนรูปปกแล้ว')}
}
function pickCover(i){const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.onchange=async()=>{const f=inp.files[0];if(!f)return;try{const r=await shrink(f);openCrop('cover',i,r.data)}catch(e){toast('อ่านรูปไม่ได้')}};inp.click()}
function edRm(i){edSync();ED.imgs.splice(i,1);renderEditor()}
function shrink(file){return new Promise((res,rej)=>{const url=URL.createObjectURL(file);const im=new Image();im.onload=()=>{const m=1200,k=Math.min(1,m/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#FBF3EA';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(b=>b?res({blob:b,data:c.toDataURL('image/jpeg',.8)}):rej(new Error('encode')),'image/jpeg',.82)};im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('read'))};im.src=url})}

function crc16(str){let c=0xFFFF;for(const b of new TextEncoder().encode(str)){c^=b<<8;for(let i=0;i<8;i++)c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
function ppPayload(amount){
 const body=PP_BASE.slice(0,-8);let out='',i=0;
 while(i<body.length){const tg=body.slice(i,i+2),ln=+body.slice(i+2,i+4),v=body.slice(i+4,i+4+ln);i+=4+ln;
  if(tg==='01'){out+='010212';continue}
  if(tg==='54')continue;
  if(tg==='58'){const a=Number(amount).toFixed(2);out+='54'+String(a.length).padStart(2,'0')+a}
  out+=tg+String(ln).padStart(2,'0')+v}
 out+='6304';return out+crc16(out);
}

function orderIsCustom(){return orderMode==='cart'?cartItems().some(c=>c.p.folder.cu):!!pd.p.folder.cu}
function payFee(){const pk=(CONFIG.pickup||[]).find(x=>x.id===recv);return pk?0:orderShip()}
function payItems(){
 const th=o=>o?(o.th||''):'';
 const list=orderMode==='cart'?cartItems().map(c=>({p:c.p,q:c.qty,opt:c.opt,card:c.card})):[{p:pd.p,q:qtyOf(pd.p),opt:curOpt(pd.p),card:curCard()}];
 return list.map(({p,q,opt,card})=>{const unit=priceOf(p,opt);let gi=0;if(canCustom(p))optsOf(p).forEach(o=>{const ch=selFor(p,o,opt||{});if(ch.gi!=null&&(p.imgs||[])[ch.gi])gi=ch.gi});const im=(p.imgs||[])[gi]||'';const ops=[canCustom(p)?optsOf(p).map(o=>`${th(o.n)}: ${th(selFor(p,o,opt).sn||selFor(p,o,opt).n)}`).join(', '):'',cardText(card)].filter(Boolean).join(', ');return {id:p.id,name:th(p.n),qty:q,unit,line:unit*q+cardFee(card),opts:ops,img:/^https?:/.test(im)?im:''}});
}
function paySub(){return payItems().reduce((a,x)=>a+x.line,0)}

const isDataImg=v=>typeof v==='string'&&v.startsWith('data:image');
function countDataImgs(o){let n=0;(function w(x){if(Array.isArray(x))x.forEach(w);else if(x&&typeof x==='object')Object.values(x).forEach(w);else if(isDataImg(x))n++})(o);return n}
async function upBlob(blob){
 const ext=(blob.type||'image/jpeg').split('/')[1].replace('jpeg','jpg');
 const path=`p/${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}.${ext}`;
 const {error}=await sb.storage.from('products').upload(path,blob,{contentType:blob.type||'image/jpeg',cacheControl:'31536000'});
 if(error)throw error;
 return sb.storage.from('products').getPublicUrl(path).data.publicUrl;
}
async function migrateImages(){
 const total=countDataImgs(CONFIG.items);if(!total)return;
 const done=new Map();let k=0;
 async function w(x){
  if(Array.isArray(x)){for(let i=0;i<x.length;i++){if(isDataImg(x[i]))x[i]=await one(x[i]);else await w(x[i])}}
  else if(x&&typeof x==='object'){for(const key of Object.keys(x)){if(isDataImg(x[key]))x[key]=await one(x[key]);else await w(x[key])}}
 }
 async function one(d){if(done.has(d))return done.get(d);k++;savingTxt.textContent=`กำลังย้ายรูป ${k}/${total}…`;const b=await (await fetch(d)).blob();const u=await upBlob(b);done.set(d,u);return u}
 await w(CONFIG.items);
}

function drawOrders(){
 const el=document.getElementById('v-orders'),R=ORD.rows;
 const head=`<div class="sec-h" style="padding:20px 16px 0"><h2 style="font-family:var(--serif);font-weight:400;font-size:24px">หลังบ้าน</h2><button class="iconbtn solid" style="border:1px solid var(--chip)" aria-label="รีเฟรช" onclick="renderOrders()">↻</button></div>
 <div class="otabs"><button class="${ORD.tab==='orders'?'on':''}" onclick="ORD.tab='orders';drawOrders()">📋 ออเดอร์ ${R.length}</button><button class="${ORD.tab==='ships'?'on':''}" onclick="ORD.tab='ships';drawOrders()">📦 เลขพัสดุ ${ORD.ships.length}</button></div>`;
 if(ORD.tab==='ships'){el.innerHTML=head+drawShips();return}
 const isSent=o=>o.status==='ส่งแล้ว',isTodo=o=>!isSent(o)&&o.status!=='ยกเลิก';
 const qq=ORD.q.trim().toLowerCase();
 const list=R.filter(o=>ORD.f==='all'||(ORD.f==='sent'?isSent(o):isTodo(o))).filter(o=>!qq||[o.order_no,o.customer_name,o.phone,o.tracking_no].join(' ').toLowerCase().includes(qq));
 el.innerHTML=head+`<div class="osearch"><input id="oQ" value="${esc(ORD.q)}" placeholder="ค้นหาเลขออเดอร์ เช่น W0012 / ชื่อ / เบอร์" oninput="ORD.q=this.value;clearTimeout(window._oq);window._oq=setTimeout(()=>{drawOrders();const i=document.getElementById('oQ');i.focus();i.setSelectionRange(i.value.length,i.value.length)},250)"></div><div class="ofilt">${[['todo','ยังไม่ส่ง',R.filter(isTodo).length],['sent','ส่งแล้ว',R.filter(isSent).length],['all','ทั้งหมด',R.length]].map(([k,l,n])=>`<button class="${ORD.f===k?'on':''}" onclick="ORD.f='${k}';drawOrders()">${l} <b>${n}</b></button>`).join('')}</div>
 <div style="padding:12px 16px 20px">${list.length?list.map(o=>{const items=Array.isArray(o.items)&&o.items.length?o.items:null;return `<div class="ocard">
  <div class="oh"><b>${esc(o.order_no||'')}</b><select class="ost s${OSTS.indexOf(o.status)}" onchange="setOStatus(${o.id},this.value)" aria-label="สถานะ">${OSTS.map(k=>`<option ${k===o.status?'selected':''}>${k}</option>`).join('')}</select></div>
  <div class="om">${new Date(o.created_at).toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'})}</div>
  ${items?items.map(it=>`<div class="oit">${itemImg(it)?`<img src="${esc(itemImg(it))}" alt="">`:'<i></i>'}<div><b>${esc(it.name)}</b>${it.opts?`<small>${esc(it.opts)}</small>`:''}<span>฿${fmt(it.unit)} × ${it.qty} = <b>฿${fmt(it.line)}</b></span></div></div>`).join(''):`<div class="oi">${esc(o.items_text).replace(/\n/g,'<br>')}</div>`}
  <div class="ob"><div>👤 <b>${esc(o.customer_name)}</b> · <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a>${o.contact?` · ${esc(o.contact)}`:''}</div>
  <div>${o.receive==='ส่งพัสดุ'?'📦 '+esc(o.address||''):'📍 '+esc(o.receive)}</div>
  ${o.need_date?`<div>🗓 ต้องการรับ ${fmtDate(o.need_date)}</div>`:''}${o.note?`<div>📝 ${esc(o.note)}</div>`:''}
  <div class="ot">สินค้า ฿${fmt(o.subtotal)} · ค่าส่ง ฿${fmt(o.shipping)} · <b>ยอดรวม ฿${fmt(o.total)}</b></div></div>
  ${o.slip_url?`<a class="oslip" href="${esc(o.slip_url)}" target="_blank" rel="noopener"><img src="${esc(o.slip_url)}" alt="สลิป" loading="lazy"><span>สลิปที่ลูกค้าโอน<br><b>฿${fmt(o.total)}</b> · แตะเพื่อดูเต็ม</span></a>`:''}
  ${o.status==='ส่งแล้ว'&&o.tracking_no?`<div class="oship done">✅ ส่งแล้ว ${o.shipped_at?fmtDate(o.shipped_at):''} · เลขพัสดุ <b>${esc(o.tracking_no)}</b></div>`:`<div class="oship"><label class="ochk"><input type="checkbox" id="sc${o.id}" onchange="document.getElementById('sf${o.id}').hidden=!this.checked"> ส่งของแล้ว</label>
   <div id="sf${o.id}" hidden><div class="row2"><input id="st${o.id}" placeholder="เลขพัสดุ" maxlength="60"><input id="sd${o.id}" type="date" value="${today()}"></div><select id="sk${o.id}">${CARRIERS.map(c=>`<option>${c}</option>`).join('')}</select><button class="btn-p" onclick="shipOrder(${o.id})">บันทึกการส่ง</button></div></div>`}
 </div>`}).join(''):`<p class="empty">${qq?'ไม่พบออเดอร์ที่ค้นหา':'ไม่มีออเดอร์ในหมวดนี้'}</p>`}</div>`;
}
async function setOStatus(id,v){const {error}=await sb.from('orders').update({status:v}).eq('id',id);if(error){toast('เปลี่ยนสถานะไม่สำเร็จ');return}const o=ORD.rows.find(x=>x.id===id);if(o)o.status=v;toast('เปลี่ยนสถานะแล้ว');drawOrders()}
async function shipOrder(id){
 const o=ORD.rows.find(x=>x.id===id),tn=(document.getElementById('st'+id).value||'').trim(),d=document.getElementById('sd'+id).value||today(),k=document.getElementById('sk'+id).value;
 if(tn.length<3){toast('ใส่เลขพัสดุก่อนนะคะ');document.getElementById('st'+id).focus();return}
 showSaving('กำลังบันทึก…');
 const a=await sb.from('orders').update({status:'ส่งแล้ว',tracking_no:tn,shipped_at:d}).eq('id',id);
 const b=a.error?a:await sb.from('shipments').insert({name:o.customer_name,ship_date:d,tracking_no:tn,carrier:k,order_no:o.order_no});
 hideSaving();if(a.error||b.error){toast('บันทึกไม่สำเร็จ');return}
 toast('บันทึกการส่งแล้ว ลูกค้าค้นหาชื่อเจอได้เลย');renderOrders();
}
function drawShips(){
 const S=ORD.ships;
 return `<div style="padding:12px 16px 20px"><div class="ocard"><b>+ เพิ่มเลขพัสดุ</b><p class="hint" style="margin:2px 0 8px">สำหรับออเดอร์ทาง LINE หรือที่อื่น ลูกค้าค้นหาจากชื่อในหน้าแรกได้</p>
  <input id="nsName" placeholder="ชื่อลูกค้า" maxlength="100"><div class="row2"><input id="nsNo" placeholder="เลขพัสดุ" maxlength="60"><input id="nsDate" type="date" value="${today()}"></div><select id="nsCar">${CARRIERS.map(c=>`<option>${c}</option>`).join('')}</select><button class="btn-p" onclick="addShip()">บันทึก</button></div>
  ${S.length?S.map(x=>`<div class="ocard shp"><div><b>${esc(x.name)}</b><small>${fmtDate(x.ship_date)} · ${esc(x.carrier)}${x.order_no?' · '+esc(x.order_no):''}</small><code>${esc(x.tracking_no)}</code></div><button class="ci-x" aria-label="ลบ" onclick="delShip(${x.id},this)">✕</button></div>`).join(''):'<p class="empty">ยังไม่มีเลขพัสดุ</p>'}</div>`;
}
async function addShip(){const n=nsName.value.trim(),tn=nsNo.value.trim();if(!n){toast('ใส่ชื่อลูกค้าก่อนนะคะ');return}if(tn.length<3){toast('ใส่เลขพัสดุก่อนนะคะ');return}
 const {error}=await sb.from('shipments').insert({name:n,ship_date:nsDate.value||today(),tracking_no:tn,carrier:nsCar.value});if(error){toast('บันทึกไม่สำเร็จ');return}toast('เพิ่มเลขพัสดุแล้ว');renderOrders()}
async function delShip(id,btn){if(!btn.classList.contains('arm')){btn.classList.add('arm');btn.textContent='ลบ?';setTimeout(()=>{btn.classList.remove('arm');btn.textContent='✕'},3000);return}
 const {error}=await sb.from('shipments').delete().eq('id',id);if(error){toast('ลบไม่สำเร็จ');return}ORD.ships=ORD.ships.filter(x=>x.id!==id);drawOrders()}

function fmtAddr(a){const c=v=>String(v||'').trim(),bkk=/กรุงเทพ/.test(a.prov||'');
 const sub=c(a.sub).replace(/^(ตำบล|ต\.|แขวง)\s*/,''),dist=c(a.dist).replace(/^(อำเภอ|อ\.|เขต)\s*/,''),prov=c(a.prov).replace(/^(จังหวัด|จ\.)\s*/,'');
 return `${c(a.line)} ${bkk?'แขวง':'ต.'}${sub} ${bkk?'เขต':'อ.'}${dist} ${bkk?'':'จ.'}${prov} ${c(a.zip)}`.replace(/\s+/g,' ').trim()}
function qrCard(total){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>{const W=720,H=980,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
 x.fillStyle='#FBF3EA';x.fillRect(0,0,W,H);x.fillStyle='#fff';x.beginPath();x.roundRect?x.roundRect(40,40,W-80,H-80,32):x.rect(40,40,W-80,H-80);x.fill();
 x.fillStyle='#3A2227';x.textAlign='center';x.font='600 34px Prompt, sans-serif';x.fillText('Pibo Collections',W/2,112);
 x.font='400 24px Prompt, sans-serif';x.fillStyle='#8C6E74';x.fillText('สแกนจ่ายผ่านแอปธนาคาร (พร้อมเพย์)',W/2,154);
 x.imageSmoothingEnabled=false;const q=520;x.drawImage(im,(W-q)/2,186,q,q);
 x.fillStyle='#A05A6A';x.font='600 56px Prompt, sans-serif';x.fillText('฿'+fmt(total),W/2,782);
 x.fillStyle='#3A2227';x.font='400 26px Prompt, sans-serif';x.fillText('บัญชี '+PP_NAME,W/2,830);
 x.fillStyle='#8C6E74';x.font='400 22px Prompt, sans-serif';x.fillText('ใส่ยอดตามนี้เองในแอปธนาคาร แล้วแนบสลิปที่หน้าเว็บ',W/2,872);
 c.toBlob(b=>b?res({blob:b,url:c.toDataURL('image/png')}):rej(new Error('qr')),'image/png')};im.onerror=rej;im.src=PP_STATIC})}
async function saveQR(total){
 const name=`pibo-qr-${total}.png`;let card;
 try{card=await qrCard(total)}catch(e){card={blob:null,url:PP_STATIC}}
 try{if(card.blob){const f=new File([card.blob],name,{type:'image/png'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f]});return}
  if(!/iPhone|iPad|iPod|Android|Line\//i.test(navigator.userAgent)){const u=URL.createObjectURL(card.blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);toast('บันทึกรูป QR แล้ว');return}}
 }catch(e){if(e&&e.name==='AbortError')return}
 let ov=document.getElementById('qrOv');if(!ov){ov=document.createElement('div');ov.id='qrOv';ov.className='zoom';document.body.appendChild(ov);ov.addEventListener('click',e=>{if(e.target===ov)ov.classList.remove('on')})}
 ov.innerHTML=`<button class="zx" aria-label="close" onclick="this.parentNode.classList.remove('on')">✕</button><div class="qrsave-box"><img src="${card.url}" alt="QR พร้อมเพย์"><p>กดค้างที่รูป แล้วเลือก <b>“บันทึกรูปภาพ”</b> หรือ <b>“เพิ่มลงในรูปภาพ”</b></p></div>`;
 ov.classList.add('on');
}

const edHasSt=()=>(ED.opts||[]).some(o=>o.ch.some(c=>String(c._st).trim()!==''));
function edOptsHTML(f){
 const O=ED.opts||[];
 return `<div class="edopts"><div class="edopts-h">ตัวเลือกสินค้า <small>เช่น แบบ 1 / แบบ 2 / สี / ขนาด</small></div>
 ${!O.length&&f.opts?`<small>ตอนนี้ใช้ตัวเลือกของหมวด (${f.opts.map(o=>o.n.th).join(', ')}) · ถ้าเพิ่มตัวเลือกที่นี่ จะใช้แทนของหมวด</small>`:''}
 ${O.map((o,gi)=>`<div class="og"><div class="og-h"><input value="${esc(o.n.th)}" placeholder="ชื่อตัวเลือก เช่น แบบ" aria-label="ชื่อตัวเลือก" oninput="ED.opts[${gi}].n.th=this.value"><button class="og-x" onclick="edOptDelG(${gi},this)">ลบกลุ่ม</button></div>
  <div class="oc-hd"><span>รูป</span><span>ชื่อแบบ</span><span>+฿</span><span>สต๊อก</span><span></span></div>
  ${o.ch.map((c,ci)=>`<div class="oc"><button class="oc-img" onclick="edPickChImg(${gi},${ci})" aria-label="เลือกรูปของแบบนี้">${c.img?`<img src="${esc(c.img)}" alt="">`:'＋รูป'}</button><input class="oc-n" value="${esc(c.sn.th)}" placeholder="แบบ ${ci+1}" aria-label="ชื่อแบบ" oninput="ED.opts[${gi}].ch[${ci}].sn.th=this.value"><input class="oc-a" type="number" inputmode="numeric" min="0" value="${esc(c._add)}" placeholder="0" aria-label="ราคาเพิ่ม" oninput="ED.opts[${gi}].ch[${ci}]._add=this.value"><input class="oc-s" type="number" inputmode="numeric" min="0" value="${esc(c._st)}" placeholder="∞" aria-label="สต๊อก" oninput="ED.opts[${gi}].ch[${ci}]._st=this.value"><button class="oc-x" onclick="edOptDelC(${gi},${ci})" aria-label="ลบแบบนี้">✕</button></div>`).join('')}
  <button class="oc-add" onclick="edOptAddC(${gi})">＋ เพิ่มแบบ</button></div>`).join('')}
 <button class="btn-s og-add" onclick="edOptAddG()">＋ เพิ่มตัวเลือกสินค้า</button>
 <small>+฿ = ราคาเพิ่มจากราคาตั้งต้น (ราคาเท่ากันเว้นว่าง) · สต๊อกเว้นว่าง = ไม่นับ · ใส่ 0 = หมด (ลูกค้ากดแบบนั้นไม่ได้)</small></div>`}
function edOptAddG(){edSync();ED.opts.push({id:rid('o'),n:{th:ED.opts.length?'':'แบบ'},ch:[{id:rid('c'),sn:{th:'แบบ 1'},_add:'',_st:''}],_new:1});renderEditor()}
function edOptAddC(gi){edSync();const o=ED.opts[gi];o.ch.push({id:rid('c'),sn:{th:(o.n.th||'แบบ')+' '+(o.ch.length+1)},_add:'',_st:''});renderEditor()}

function edPickChImg(gi,ci){
 edSync();let ov=document.getElementById('chImgOv');if(!ov){ov=document.createElement('div');ov.id='chImgOv';ov.className='zoom';document.body.appendChild(ov);ov.addEventListener('click',e=>{if(e.target===ov)ov.classList.remove('on')})}
 ov.innerHTML=`<div class="chpick"><div class="crop-h">รูปของแบบนี้ <small>เลือกจากรูปสินค้า หรืออัปโหลดใหม่</small></div>

  <label class="ed-add">＋<br>อัปโหลด<input type="file" accept="image/*" onchange="edUpChImg(${gi},${ci},this)"></label></div>
  <div class="crop-f">${ED.opts[gi].ch[ci].img?`<button class="btn-s" onclick="ED.opts[${gi}].ch[${ci}].img='';delete ED.opts[${gi}].ch[${ci}].gi;document.getElementById('chImgOv').classList.remove('on');renderEditor()">ไม่ใช้รูป</button>`:''}<button class="btn-s" onclick="document.getElementById('chImgOv').classList.remove('on')">ปิด</button></div></div>`;

function edSetChImg(gi,ci,i){ED.opts[gi].ch[ci].img=ED.imgs[i];document.getElementById('chImgOv').classList.remove('on');renderEditor()}
async function edUpChImg(gi,ci,inp){const f=inp.files&&inp.files[0];if(!f)return;showSaving('กำลังอัปรูป…');
 try{const r=await shrink(f);let src=r.data;if(ADM.assets){try{const up=await ADM.assets.upload(r.blob);if(up&&up.url)src=up.url}catch(e){}}ED.imgs.push(src);ED.opts[gi].ch[ci].img=src}catch(e){toast('อ่านรูปไม่ได้ ลองรูปอื่นนะคะ')}
 hideSaving();document.getElementById('chImgOv').classList.remove('on');renderEditor()}
function edOptsOut(prod){
 const O=ED.opts||[];if(!O.length){delete prod.opts;return true}
 const out=[];
 for(const o of O){
  const name=(o.n.th||'').trim();if(!name){toast('ใส่ชื่อตัวเลือก เช่น “แบบ” ก่อนนะคะ');return false}
  const ch=[];
  for(const c of o.ch){const sn=(c.sn.th||'').trim();if(!sn){toast('ใส่ชื่อแบบให้ครบทุกช่องนะคะ');return false}
   const x={...c};delete x._add;delete x._st;delete x._new;
   x.sn={...(c.sn||{}),th:sn};
   if(!x.n||!x.n.th||x.n.th===(c._oldsn||'')||o._new||!c.n)x.n={...(x.n||{}),th:sn};
   const a=Math.max(0,Math.round(+c._add||0));if(a)x.add=a;else delete x.add;
   if(String(c._st).trim()!=='')x.st=Math.max(0,Math.round(+c._st||0));else delete x.st;
   if(x.img){const k=prod.imgs.indexOf(x.img);if(k>=0)x.gi=k;else if(!(x.gi>=0&&x.gi<prod.imgs.length))delete x.gi}else delete x.gi;
   if(!x.img)delete x.img;
   ch.push(x)}
  const g={...o,n:{...(o.n||{}),th:name},ch};delete g._new;out.push(g)}
 prod.opts=out;
 if(prod.def){Object.keys(prod.def).forEach(k=>{const g=out.find(o=>o.id===k);if(!g||!g.ch.some(c=>c.id===prod.def[k]))delete prod.def[k]});if(!Object.keys(prod.def).length)delete prod.def}
 const sums=out.filter(o=>o.ch.some(c=>typeof c.st==='number')).map(o=>o.ch.reduce((a,c)=>a+(typeof c.st==='number'?c.st:0),0));
 if(sums.length)prod.stock=Math.min(...sums);
 if(sums.length&&!prod.qty)prod.qty=true;
 return true;
}

function openClosed(){const c=CONFIG.closed||{};CL={on:!!c.on,msg:c.msg||'',f:CONFIG.items.map(f=>({c:!!f.closed,m:f.closedMsg||''}))};renderClosed();scrim.classList.add('on');sheet.classList.add('on')}
function renderClosed(){
 sheet.innerHTML=`<div class="sheet-h"><h3>ปิดรับออเดอร์</h3><button class="x" aria-label="close" onclick="closeAll()">✕</button></div>
 <div class="sheet-b ed">
  <label class="clsw"><input type="checkbox" ${CL.on?'checked':''} onchange="CL.on=this.checked;renderClosed()"><span><b>ปิดรับทั้งร้าน</b><small>ลูกค้ายังดูสินค้าได้ แต่กดสั่ง/จ่ายเงินไม่ได้</small></span></label>
  ${CL.on?`<label for="clMsg">ข้อความแจ้งลูกค้า</label><input id="clMsg" value="${esc(CL.msg)}" placeholder="เช่น ปิดรับถึง 30 พ.ย. เปิดอีกที 1 ธ.ค." oninput="CL.msg=this.value">`:''}
  <label style="margin-top:18px">ปิดรับเฉพาะหมวด</label>
  ${CONFIG.items.map((f,i)=>`<label class="clsw sm"><input type="checkbox" ${CL.f[i].c?'checked':''} ${CL.on?'disabled':''} onchange="CL.f[${i}].c=this.checked;renderClosed()"><span>${esc(L(f.n))}</span></label>${CL.f[i].c&&!CL.on?`<input class="clfm" value="${esc(CL.f[i].m)}" placeholder="ข้อความ (ไม่ใส่ก็ได้)" aria-label="ข้อความของหมวด ${esc(L(f.n))}" oninput="CL.f[${i}].m=this.value">`:''}`).join('')}
 </div>
 <div class="sheet-f" style="flex-direction:row"><button class="btn-p" style="flex:2" onclick="saveClosed()">บันทึก</button></div>`;
}
function saveClosed(){
 CONFIG.closed={on:CL.on,msg:(CL.msg||'').trim()};
 CONFIG.items.forEach((f,i)=>{if(CL.f[i].c){f.closed=true;const m=(CL.f[i].m||'').trim();if(m)f.closedMsg=m;else delete f.closedMsg}else{delete f.closed;delete f.closedMsg}});
 renderClosedBar();publishShop(CL.on?'ปิดรับออเดอร์ทั้งร้านแล้ว':'บันทึกแล้ว');
}

renderHome();updCartBadge();
function routeHash(){const m=location.hash.match(/^#p-([A-Za-z0-9-]+)$/);if(m&&findP(m[1]))openProduct(m[1])}
window.addEventListener('hashchange',routeHash);routeHash();
</script></body></html>
